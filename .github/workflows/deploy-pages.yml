name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # stamp asset URLs with the commit so browsers that cached the old
      # app.js / src modules fetch the new ones as soon as index.html updates
      - name: Version asset URLs
        run: sed -i -E "s#(src|href)=\"([^\"]+\.(js|css))\"#\1=\"\2?v=${GITHUB_SHA::8}\"#g" index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
